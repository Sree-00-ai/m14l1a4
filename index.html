
<!DOCTYPE html>
<html>
<head>
    <title>Random Numbers Using While Loop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            padding: 25px;
            max-width: 450px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        button {
            background-color: #4f46e5;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            color: #3730a3;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Random Number Generator</h2>

        <p>Click the button to generate 5 random numbers.</p>

        <button onclick="generateNumbers()">
            Generate Numbers
        </button>

        <p id="result"></p>
    </div>

    <script>
        function generateNumbers() {

            let count = 1;
            let output = "";

            while (count <= 5) {

                let randomNumber = Math.floor(Math.random() * 100) + 1;

                output += randomNumber + "<br>";

                count++;
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>

</body>
</html>
